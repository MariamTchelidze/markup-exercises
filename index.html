<!doctype html>

  <body>
    <header class="header">

        <!-- TOP BAR -->
        <div class="top-header">
          <div class="logo-container">

              <img src="./assets/images/Ozoon-Logo.svg" alt="Ozoon Casino" />
            </a>
          </div>

          <div class="account-center">
            <div class="account-access">
              <a class="button-login" href="#">Join</a>
              <a class="button-login" href="#">Login</a>
            </div>
            <button class="burger">
              <img src="./assets/images/Burger-menu.svg" alt="Menu" />
            </button>
          </div>
        </div>

        <!-- NAVIGATION -->
        <nav class="navigation">
          <ul class="nav_lists">
            <li><a href="#">Sports</a></li>
            <li><a href="#">Casino</a></li>

          </ul>

      </div>
    </header>
    <main>
      <section class="hero-section">

          <h1>welcome to ozoon casino</h1>

        <div class="hero-form">
          <h3 class="form-heading">Join Our Community</h3>
          <div class="progress-bar">
            <span></span>
          </div>
          <form class="account-form" action="" method="POST">
            <!-- Form fields would go here -->
            <div class="first-row">
              <input type="text" placeholder="First Name*" required />
              <input type="text" placeholder="Last Name" required />
            </div>
            <div class="full-row">
              <input type="date" placeholder="Date of Birth" />
            </div>
            <div class="buttons-row">
              <button class="step-btn">Next</button>
              <button class="step-btn">Back</button>
            </div>
          </form>
        </div>
      </section>
    </main>
